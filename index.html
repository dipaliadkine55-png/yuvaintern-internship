<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Interactive, accessible analytics dashboard built with modern web standards.">
  <title>MetricsHub | Enterprise Analytics Dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header role="banner" class="app-header">
    <div class="header-container">
      <h1>MetricsHub Dashboard</h1>
      <span class="badge" aria-label="System status operational">Live System</span>
    </div>
  </header>

  <main id="main-content" class="app-container" role="main">
    <!-- Summary Cards -->
    <section class="kpi-grid" aria-label="Key Performance Indicators">
      <article class="kpi-card">
        <h2>Total Revenue</h2>
        <p class="kpi-value" id="kpi-revenue">--</p>
      </article>
      <article class="kpi-card">
        <h2>Active Users</h2>
        <p class="kpi-value" id="kpi-users">--</p>
      </article>
      <article class="kpi-card">
        <h2>Conversion Rate</h2>
        <p class="kpi-value" id="kpi-conversion">--</p>
      </article>
    </section>

    <!-- Visual Analytics -->
    <section class="panel chart-panel" aria-labelledby="chart-heading">
      <h2 id="chart-heading">6-Month Revenue Trend</h2>
      <div class="chart-wrapper">
        <canvas id="revenueChart" width="600" height="250" aria-label="Bar chart showing 6-month revenue growth from January to June" role="img"></canvas>
      </div>
    </section>

    <!-- Interactive Data Table -->
    <section class="panel table-panel" aria-labelledby="table-heading">
      <div class="table-header-controls">
        <h2 id="table-heading">Product Performance</h2>
        <div class="controls-group">
          <label for="category-filter">Category:</label>
          <select id="category-filter" aria-controls="data-table">
            <option value="All">All Categories</option>
            <option value="Software">Software</option>
            <option value="Infrastructure">Infrastructure</option>
            <option value="Services">Services</option>
          </select>

          <label for="status-filter">Status:</label>
          <select id="status-filter" aria-controls="data-table">
            <option value="All">All Statuses</option>
            <option value="Active">Active</option>
            <option value="Pending">Pending</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
        <table id="data-table" aria-describedby="table-heading">
          <thead>
            <tr>
              <th scope="col">Product Name</th>
              <th scope="col">Category</th>
              <th scope="col">Status</th>
              <th scope="col" class="num-col">Value ($)</th>
              <th scope="col" class="num-col">Growth (%)</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Dynamic Injection -->
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <footer role="contentinfo" class="app-footer">
    <p>&copy; 2026 MetricsHub Inc. All rights reserved. Built for accessibility and speed.</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
